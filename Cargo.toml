[package]
name = "miniz_nrp"
description = "zlib and DEFLATE compression in pure, safe Rust: a native port of miniz, bit-identical to it at every level."
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/OctoKeights/miniz_nrp"
readme = "README.md"
keywords = ["zlib", "deflate", "compression", "miniz", "inflate"]
categories = ["compression"]

[dependencies]

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
